[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tower-defense-optimizer"
version = "0.1.0"
description = "An educational deterministic tower-defense search demonstration."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tower-defense-optimizer = "tower_defense_optimizer.__main__:main"
tower-defense-optimizer-ui = "tower_defense_optimizer.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88
